name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Database and scheduler tests
        run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          # the address Pages actually serves this repository from, so the
          # build stays right if the repository moves to another account
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: End-to-end and accessibility tests (production build, demo mode)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node scripts/e2e.mjs http://localhost:4173/
          # the demo data is relative to "today": also walk it on a Friday evening and a Sunday
          FAKE_TIME=2026-10-23T19:00:00+08:00 node scripts/e2e.mjs http://localhost:4173/
          FAKE_TIME=2026-10-25T12:00:00+08:00 node scripts/e2e.mjs http://localhost:4173/
          node scripts/a11y.mjs http://localhost:4173/
        env:
          CI: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Applies new supabase/migrations files to the live database once every
  # test has passed, before the site that may call them goes out. Other
  # branches and pull requests only list what would be applied.
  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Push database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # session-mode pooler: runners have no IPv6 for the direct db host
          POOLER_HOST: aws-0-ap-northeast-1.pooler.supabase.com
          LIVE: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            if [ "$LIVE" = true ]; then
              echo "::error::Add the database password as the SUPABASE_DB_PASSWORD repository secret"
              exit 1
            fi
            echo "::notice::No SUPABASE_DB_PASSWORD available, skipping the migration check"
            exit 0
          fi
          ref=$(sed -n 's#^VITE_SUPABASE_URL=https://\([a-z0-9]*\)\.supabase\.co.*#\1#p' .env.production)
          pw=$(node -e 'process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
          echo "::add-mask::$pw"
          url="postgresql://postgres.$ref:$pw@$POOLER_HOST:5432/postgres"
          if [ "$LIVE" = true ]; then
            supabase db push --db-url "$url" --yes
          else
            supabase db push --db-url "$url" --dry-run
          fi
      # The Discord bot's interactions endpoint (supabase/functions/discord).
      # Deploying needs a Supabase access token; without one it is skipped.
      - name: Deploy the Discord function
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Add a Supabase access token as the SUPABASE_ACCESS_TOKEN repository secret to deploy supabase/functions/discord"
            exit 0
          fi
          ref=$(sed -n 's#^VITE_SUPABASE_URL=https://\([a-z0-9]*\)\.supabase\.co.*#\1#p' .env.production)
          supabase functions deploy discord --project-ref "$ref" --no-verify-jwt --use-api

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
