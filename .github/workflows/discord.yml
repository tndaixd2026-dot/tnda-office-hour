# Asks each group in its own Discord channel about the coming week
# (scripts/discord-ask.mjs). GitHub starts scheduled runs late at busy
# times, so each one starts early and the script waits for the exact time
# in Taipei:
#   Friday 12:00    each group's message about next week, with the
#                   buttons to book it (a Discord form) or skip it
#   Saturday 20:00  the week has closed: each message shows the outcome
# Needs the repository secret DISCORD_BOT_TOKEN besides
# SUPABASE_DB_PASSWORD; until it is there the runs do nothing.
name: Discord weekly ask

on:
  schedule:
    - cron: '38 3 * * 5' # Friday 11:38 Taipei
    - cron: '38 11 * * 6' # Saturday 19:38 Taipei
  workflow_dispatch:
    inputs:
      kind:
        description: 'setup：連接機器人、找出各組的頻道，不發訊息；ask：發下一週的詢問（每組每週一次）；close：把已截止的訊息改成結果'
        type: choice
        options: [setup, ask, close]
        default: setup
      only:
        description: 'ask 只發給這一組（填組別編號，例如 2），空白就發給全部'
        type: string
        default: ''
      force:
        description: '這週已經發過也再發一次'
        type: boolean
        default: false
      dry_run:
        description: '只列出要發的訊息，不真的發'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-ask
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Ask
        env:
          KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || (github.event.schedule == '38 3 * * 5' && 'ask' || 'close') }}
          SEND_AT: ${{ github.event_name == 'schedule' && (github.event.schedule == '38 3 * * 5' && '12:00' || '20:01') || '' }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # session-mode pooler: runners have no IPv6 for the direct db host
          POOLER_HOST: aws-0-ap-northeast-1.pooler.supabase.com
        run: node scripts/discord-ask.mjs
